services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: axion-api:local
    ports:
      - "8000:8000"
    volumes:
      - ./outputs/violations:/app/outputs/violations
    environment:
      PYTHONUNBUFFERED: "1"
    networks:
      - auditor-network

  auditor:
    build:
      context: .
      dockerfile: Dockerfile
    image: axion-auditor:local
    volumes:
      - ./data/data-masc:/app/data/data-masc:ro
      - ./outputs/violations:/app/outputs/violations
    environment:
      PYTHONUNBUFFERED: "1"
      PARSER_MAX_FILES: "0"
    networks:
      - auditor-network

networks:
  auditor-network:
    driver: bridge
