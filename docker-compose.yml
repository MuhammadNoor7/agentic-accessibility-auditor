services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app/backend
    networks:
      - auditor-network

  auditor:
    build: .
    command: python /app/test_run.py
    volumes:
      - .:/app
      - ./data-masc/data-masc:/app/data/dataset
    environment:
      PYTHONUNBUFFERED: "1"
      PARSER_MAX_FILES: "0"
    networks:
      - auditor-network

networks:
  auditor-network:
    driver: bridge
