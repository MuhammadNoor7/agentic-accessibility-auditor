services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - auditor-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app/backend
    env_file:
      - .env
    networks:
      - auditor-network

  auditor:
    build: .
    command: python /app/test_run.py
    volumes:
      - .:/app
    environment:
      PYTHONUNBUFFERED: "1"
      PARSER_MAX_FILES: "0"
      DATASET_ROOT: "/app/data/data-masc"
    networks:
      - auditor-network

networks:
  auditor-network:
    driver: bridge
