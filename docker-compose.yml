services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: ghcr.io/muhammadnoor7/agentic-accessibility-auditor:api-noor
    ports:
      - "8000:8000"
    volumes:
      - ./outputs/violations:/app/outputs/violations
    environment:
      PYTHONUNBUFFERED: "1"
    networks:
      - auditor-network

  auditor:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/muhammadnoor7/agentic-accessibility-auditor:auditor-noor
    volumes:
      - ./data/data-masc:/app/data/data-masc:ro
      - ./outputs/violations:/app/outputs/violations
    environment:
      PYTHONUNBUFFERED: "1"
      PARSER_MAX_FILES: "0"
    networks:
      - auditor-network

networks:
  auditor-network:
    driver: bridge
