services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app/backend
    environment:
      - JWT_SECRET=dev-secret-change-in-prod
    networks:
      - auditor-network

  auditor:
    build: .
    command: python /app/test_run.py
    volumes:
      - .:/app
    environment:
      PYTHONUNBUFFERED: "1"
      PARSER_MAX_FILES: "0"
      DATASET_ROOT: "/app/data/data-masc"
    networks:
      - auditor-network

networks:
  auditor-network:
    driver: bridge
